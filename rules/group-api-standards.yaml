rules:
  group-authorization-header:
    description: "The authorization header must be 'Authorization'."
    given:
      - "$.data"
    severity: error
    then:
      field: "authorizationHeader"
      function: pattern
      functionOptions:
        match: "^Authorization$"
  group-advertiseInfo-apiOwner-mandatory:
    description: "Every Group API must define a API Owner."
    given:
      - "$.data"
    severity: error
    then:
      field: "advertiseInfo.apiOwner"
      function: truthy
  group-api-visibilty-mandatory:
    description: "Every Group API must be visibility Public"
    given:
      - "$.data"
    severity: error
    then:
      field: "visibility"
      function: truthy
  group-security-scheme-mandatory:
    description: "Every Group API must define a security scheme."
    given:
      - "$.data"
    severity: error
    then:
      field: "securityScheme"
      function: truthy
