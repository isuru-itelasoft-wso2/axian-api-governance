rules:

  api-name:
    given:
      - "$.data"
    severity: error
    then:
      function: pattern
      field: "name"
      functionOptions:
        match: '^[A-Z][A-Z0-9]*-[A-Za-z0-9-]+-API$'
    description: |-
      The API name must follow the organization and domain naming convention:

      <Organization>-<Domain>-API

      Examples:
      MVOLA-Customer-API
      TIGO-Merchant-API
      MVOLA-Payment-API
      TIGO-Merchant-Management-API

    message: "API name must follow the format <Organization>-<Domain>-API."
  
  api-version:
    given:
      - "$.data"
    severity: error
    then:
      function: pattern
      field: "version"
      functionOptions:
        match: '^[0-9]+\.[0-9]+\.[0-9]+$'
    description: |-
      The API version must follow MAJOR.MINOR.PATCH format.

      Valid:
      1.0.0
      1.2.3
      2.0.0

      Invalid:
      v1
      v1.0
      1
      1.0
    message: "API version must follow MAJOR.MINOR.PATCH format, for example 1.0.0."

